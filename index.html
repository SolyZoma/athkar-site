<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة الذكية | بإشراف وتصميم / حازم وولده سليم حازم</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        header h1 {
            font-size: 18px;
            margin: 0 0 3px 0;
        }
        header p {
            font-size: 12px;
            margin: 0;
            opacity: 0.9;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
        }
        /* قسم الموقع الجغرافي */
        .location-box {
            font-size: 18px;
            font-weight: bold;
            color: #2980b9;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        /* حاوية الصلاة الرئيسية */
        .prayer-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        /* تصميم الساعة الدائرية البسيطة */
        .clock-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 15px auto;
            background: #fff;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .clock-face {
            font-size: 12px;
            color: #7f8c8d;
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        .clock-number {
            position: absolute;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            font-weight: bold;
            font-size: 13px;
        }
        /* عقارب الساعة */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 4px;
        }
        .hour-hand {
            width: 4px;
            height: 45px;
            background: #2c3e50;
            transform: translateX(-50%);
        }
        .minute-hand {
            width: 3px;
            height: 65px;
            background: #3498db;
            transform: translateX(-50%);
        }
        .center-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #e74c3c;
            border-radius: 50%;
        }

        /* تفاصيل الصلاة القادمة والعد */
        .next-prayer-title {
            font-size: 20px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .next-prayer-time {
            font-size: 18px;
            color: #555;
            margin-bottom: 12px;
        }
        .timer-display {
            font-size: 22px;
            font-family: monospace;
            font-weight: bold;
            color: #2980b9;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            letter-spacing: 1px;
        }

        /* جدول الصلوات الكامل */
        .prayer-table {
            background: white;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: right;
        }
        .prayer-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            border-radius: 6px;
        }
        .prayer-row:last-child {
            border-bottom: none;
        }
        .active-row {
            background-color: rgba(41, 128, 185, 0.1);
            color: #2980b9;
            font-weight: bold;
            border-right: 4px solid #2980b9;
        }
        footer {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>مواقيت الصلاة الذكية | SolyZoma</h1>
        <p>تحديث تلقائي للموقع والأوقات</p>
    </header>

    <main>
        <!-- اللوكيشن -->
        <div class="location-box">
            📍 <span id="location-name">جاري تحديد الموقع...</span>
        </div>

        <!-- بطاقة الصلاة القادمة والساعة -->
        <div class="prayer-card">
            <!-- الساعة التناظرية -->
            <div class="clock-container" id="analog-clock">
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="center-dot"></div>
                <!-- أرقام الساعة مبسطة -->
                <div class="clock-number" style="top: 8px; left: 50%; transform: translateX(-50%);">12</div>
                <div class="clock-number" style="top: 22px; right: 38px;">1</div>
                <div class="clock-number" style="top: 55px; right: 15px;">2</div>
                <div class="clock-number" style="top: 95px; right: 10px;">3</div>
                <div class="clock-number" style="bottom: 55px; right: 15px;">4</div>
                <div class="clock-number" style="bottom: 22px; right: 38px;">5</div>
                <div class="clock-number" style="bottom: 8px; left: 50%; transform: translateX(-50%);">6</div>
                <div class="clock-number" style="bottom: 22px; left: 38px;">7</div>
                <div class="clock-number" style="bottom: 55px; left: 15px;">8</div>
                <div class="clock-number" style="top: 95px; left: 10px;">9</div>
                <div class="clock-number" style="top: 55px; left: 15px;">10</div>
                <div class="clock-number" style="top: 22px; left: 38px;">11</div>
            </div>

            <div id="next-prayer-name" class="next-prayer-title">الصلاة القادمة: --</div>
            <div id="next-prayer-time" class="next-prayer-time">--:--</div>
            <div id="timer-box" class="timer-display">--:--:--</div>
        </div>

        <!-- جدول مواقيت اليوم -->
        <div class="prayer-table">
            <div class="prayer-row" id="row-Fajr"><span>الفجر</span><span id="time-Fajr">--:--</span></div>
            <div class="prayer-row" id="row-Sunrise"><span>الشروق</span><span id="time-Sunrise">--:--</span></div>
            <div class="prayer-row" id="row-Dhuhr"><span>الظهر</span><span id="time-Dhuhr">--:--</span></div>
            <div class="prayer-row" id="row-Asr"><span>العصر</span><span id="time-Asr">--:--</span></div>
            <div class="prayer-row" id="row-Maghrib"><span>المغرب</span><span id="time-Maghrib">--:--</span></div>
            <div class="prayer-row" id="row-Isha"><span>العشاء</span><span id="time-Isha">--:--</span></div>
        </div>
    </main>

    <footer>
        <p>تقبل الله طاعتكم</p>
    </footer>

    <script>
        let prayersData = {};

        // تحويل نظام 24 ساعة إلى 12 ساعة مع (ص / م)
        function format12Hour(time24) {
            if (!time24) return "--:--";
            let [hours, minutes] = time24.split(':').map(Number);
            let period = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')} ${period}`;
        }

        // حركة الساعة التناظرية
        function updateAnalogClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const hourDeg = (hours * 30) + (minutes * 0.5);
            const minuteDeg = (minutes * 6) + (seconds * 0.1);

            document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
            document.getElementById('minute-hand').style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
        }
        setInterval(updateAnalogClock, 1000);
        updateAnalogClock();

        // جلب الموقع الجغرافي للمستخدم أوتوماتيك
        function initLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        fetchTimesByCoords(lat, lon);
                    },
                    error => {
                        console.log("فشل تحديد الموقع، جاري استخدام القافية الافتراضية (الإسكندرية)");
                        fetchTimesByCity("Alexandria", "Egypt");
                    }
                );
            } else {
                fetchTimesByCity("Alexandria", "Egypt");
            }
        }

        async function fetchTimesByCoords(lat, lon) {
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`);
                const data = await response.json();
                processPrayerData(data.data);
                document.getElementById('location-name').innerText = "الموقع الحالي (تلقائي)";
            } catch (e) {
                fetchTimesByCity("Alexandria", "Egypt");
            }
        }

        async function fetchTimesByCity(city, country) {
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=5`);
                const data = await response.json();
                processPrayerData(data.data);
                document.getElementById('location-name').innerText = "الإسكندرية (افتراضي)";
            } catch (e) {
                console.log("خطأ في جلب البيانات");
            }
        }

        function processPrayerData(data) {
            const timings = data.timings;
            prayersData = {
                Fajr: { name: 'الفجر', time: timings.Fajr },
                Sunrise: { name: 'الشروق', time: timings.Sunrise },
                Dhuhr: { name: 'الظهر', time: timings.Dhuhr },
                Asr: { name: 'العصر', time: timings.Asr },
                Maghrib: { name: 'المغرب', time: timings.Maghrib },
                Isha: { name: 'العشاء', time: timings.Isha }
            };

            for (let key in prayersData) {
                const elem = document.getElementById(`time-${key}`);
                if (elem) elem.innerText = format12Hour(prayersData[key].time);
            }

            updateLogic();
            setInterval(updateLogic, 1000);
        }

        // منطق العد التنازلي والتصاعدي مثل الكود المطلوب تماماً
        function updateLogic() {
            const now = new Date();
            const currentMinutesTotal = now.getHours() * 60 + now.getMinutes();
            const currentSecondsTotal = currentMinutesTotal * 60 + now.getSeconds();

            let targetPrayer = null;
            let minDiff = Infinity;

            const keys = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

            // تحديد الصلاة الحالية أو القادمة
            for (let key of keys) {
                const [h, m] = prayersData[key].time.split(':').map(Number);
                const prayerMinutesTotal = h * 60 + m;
                const diff = prayerMinutesTotal - currentMinutesTotal;

                // إذا كانت الصلاة خلال دقيقة الأذان أو بعده بفترة قصيرة (لحد 30 دقيقة)
                if (diff <= 0 && diff >= -30) {
                    targetPrayer = key;
                    break;
                }
            }

            // لو مش في فترة بعد الأذان، هات الصلاة القادمة القادمة
            if (!targetPrayer) {
                for (let key of keys) {
                    const [h, m] = prayersData[key].time.split(':').map(Number);
                    const prayerMinutesTotal = h * 60 + m;
                    let diff = prayerMinutesTotal - currentMinutesTotal;
                    if (diff > 0 && diff < minDiff) {
                        minDiff = diff;
                        targetPrayer = key;
                    }
                }
                if (!targetPrayer) targetPrayer = 'Fajr'; // لو اليوم خلص
            }

            // تطبيق التظليل في الجدول
            document.querySelectorAll('.prayer-row').forEach(r => r.classList.remove('active-row'));
            document.getElementById(`row-${targetPrayer}`).classList.add('active-row');

            document.getElementById('next-prayer-name').innerText = `الصلاة القادمة: ${prayersData[targetPrayer].name}`;
            document.getElementById('next-prayer-time').innerText = format12Hour(prayersData[targetPrayer].time);

            // حساب العداد (تنازلي أو تصاعدي بعد الأذان)
            const [ph, pm] = prayersData[targetPrayer].time.split(':').map(Number);
            const prayerSecTotal = (ph * 60 + pm) * 60;
            const nowSecTotal = currentSecondsTotal;
            const diffSec = prayerSecTotal - nowSecTotal;

            let timerText = "";
            if (diffSec === 0 || (diffSec < 0 && diffSec >= -60)) {
                timerText = "الآن 🕌";
            } else if (diffSec < 0 && diffSec >= -1800) { // بعد الأذان بحد أقصى نص ساعة (1800 ثانية) عد تصاعدي
                let passedSec = Math.abs(diffSec);
                let m = Math.floor(passedSec / 60);
                let s = passedSec % 60;
                timerText = `+ 00 : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
            } else if (diffSec > 0) { // قبل الأذان عد تنازلي
                let h = Math.floor(diffSec / 3600);
                let m = Math.floor((diffSec % 3600) / 60);
                let s = diffSec % 60;
                timerText = `- ${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
            } else {
                // لو عدى نص ساعة، اذهب للصلاة اللي بعدها
                timerText = "جاري الانتقال للصلاة التالية...";
            }

            document.getElementById('timer-box').innerText = timerText;
        }

        // تشغيل النظام
        initLocation();
    </script>
</body>
</html>
